<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="440" viewBox="0 0 1400 440" role="img">
<title>Peran pengguna KYŪSUI</title><rect width="1400" height="440" rx="28" fill="#071B2B"/>
<text x="700" y="65" text-anchor="middle" fill="#E9FAFC" font-family="Arial,sans-serif" font-size="34" font-weight="700">TIGA PERAN PENGGUNA</text>
<g font-family="Arial,sans-serif">
 <rect x="65" y="120" width="390" height="250" rx="22" fill="#10394D" stroke="#4ACAD4" stroke-width="3"/>
 <text x="260" y="180" text-anchor="middle" fill="#7BE3E8" font-size="29" font-weight="700">CUSTOMER</text>
 <text x="260" y="235" text-anchor="middle" fill="#FFFFFF" font-size="21">Jelajahi produk</text><text x="260" y="273" text-anchor="middle" fill="#FFFFFF" font-size="21">Buat &amp; bayar pesanan</text><text x="260" y="311" text-anchor="middle" fill="#FFFFFF" font-size="21">Pantau pengiriman</text>
 <rect x="505" y="120" width="390" height="250" rx="22" fill="#124C58" stroke="#58D5D4" stroke-width="3"/>
 <text x="700" y="180" text-anchor="middle" fill="#9AF0E8" font-size="29" font-weight="700">OWNER</text>
 <text x="700" y="235" text-anchor="middle" fill="#FFFFFF" font-size="21">Kelola produk &amp; pesanan</text><text x="700" y="273" text-anchor="middle" fill="#FFFFFF" font-size="21">Verifikasi pembayaran</text><text x="700" y="311" text-anchor="middle" fill="#FFFFFF" font-size="21">Pantau operasional</text>
 <rect x="945" y="120" width="390" height="250" rx="22" fill="#10394D" stroke="#4ACAD4" stroke-width="3"/>
 <text x="1140" y="180" text-anchor="middle" fill="#7BE3E8" font-size="29" font-weight="700">COURIER</text>
 <text x="1140" y="235" text-anchor="middle" fill="#FFFFFF" font-size="21">Ambil penugasan</text><text x="1140" y="273" text-anchor="middle" fill="#FFFFFF" font-size="21">Perbarui status &amp; lokasi</text><text x="1140" y="311" text-anchor="middle" fill="#FFFFFF" font-size="21">Selesaikan pengantaran</text>
</g></svg>